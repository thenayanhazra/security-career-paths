name: Review staleness

on:
  schedule:
    - cron: "0 6 1 * *"   # 1st of every month
  workflow_dispatch:

jobs:
  staleness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check review dates (> 12 months old)
        id: check
        continue-on-error: true
        run: |
          python3 scripts/validate.py --max-age-months 12 2>&1 | tee staleness.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
      - name: Report stale pages
        if: steps.check.outputs.exit_code != '0'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('staleness.log', 'utf8').trim();
            const title = 'Pages due for annual review';
            const body = `The monthly review-date check found pages last reviewed more than 12 months ago:\n\n\`\`\`\n${log}\n\`\`\`\n\nVerify certifications, frameworks and links on these pages, then update their \`*Last reviewed:*\` line.`;
            const { data: issues } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'correction',
              per_page: 50,
            });
            const existing = issues.find((i) => i.title === title);
            if (existing) {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: existing.number,
                body,
              });
            } else {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body,
                labels: ['correction'],
              });
            }
